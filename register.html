<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — Fluento</title>
  <link rel="icon" href="images/logo.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="register.css">
</head>
<body>
<header class="nav">
  <a href="index.html" class="logo">Fluento</a>
  <nav class="menu">
    <a href="index.html">← На главную</a>
  </nav>
</header>

  <main class="register-main">
    <form class="register-form" id="registerForm" novalidate>
      <h1>Регистрация</h1>

      <div class="form-group">
        <label for="username">Имя пользователя</label>
        <input type="text" id="username" placeholder="ivan_petrov" autocomplete="username" autofocus>
        <small class="error" id="usernameError"></small>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="ivan@example.com" autocomplete="email">
        <small class="error" id="emailError"></small>
      </div>

      <div class="form-group">
        <label for="password">Пароль</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Минимум 8 символов" autocomplete="new-password">
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Показать пароль">👁</button>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <p class="strength-text" id="strengthText">Введите пароль</p>
        <small class="error" id="passwordError"></small>
      </div>

      <div class="form-group">
        <label for="confirm">Подтверждение пароля</label>
        <input type="password" id="confirm" placeholder="Повторите пароль" autocomplete="new-password">
        <small class="error" id="confirmError"></small>
      </div>

      <div class="form-group checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" id="terms">
          <span>Я согласен с <a href="#">условиями обработки</a></span>
        </label>
        <small class="error" id="termsError"></small>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn" disabled>
        <span class="btn-text">Зарегистрироваться</span>
        <span class="btn-spinner"></span>
      </button>

      <p class="form-footer">
        Уже есть аккаунт? <a href="login.html">Войти</a>
      </p>
    </form>
  </main>

  <!-- Модалка успеха -->
  <div class="modal-overlay" id="successModal">
    <div class="modal">
      <div class="modal-icon">✅</div>
      <h2>Регистрация успешна!</h2>
      <p>Добро пожаловать в Fluento!</p>
      <button class="modal-btn" id="modalClose">Продолжить</button>
    </div>
  </div>

  <footer class="footer">
    <div class="f-grid"><div><p>© 2026, Fluento</p></div><div><p>Контакты</p><a href="mailto:hello@fluento.example">hello@fluento.example</a></div><div><p>Услуги</p><p>Языки · Преподаватели</p></div></div>
  </footer>

  <script src="register.js"></script>
</body>
</html>
